name: Deploy CloudFiles BFF Functions
on:
  push:
    branches:
    - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: cloud-files-api
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: ./api
  RESOURCE_GROUP: resource_cloud-files
  STORAGE_ACCOUNT: cloudfilesstorage1
  DEPLOY_CONTAINER: deployments

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output ./published
    - name: Zip package
      shell: pwsh
      run: Compress-Archive -Path ".\published\*" -DestinationPath ".\deploy.zip" -Force
    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Upload package to blob storage
      shell: pwsh
      run: |
        $key = az storage account keys list `
          --account-name "${{ env.STORAGE_ACCOUNT }}" `
          --resource-group "${{ env.RESOURCE_GROUP }}" `
          --query "[0].value" -o tsv
        az storage blob upload `
          --account-name "${{ env.STORAGE_ACCOUNT }}" `
          --account-key $key `
          --container-name "${{ env.DEPLOY_CONTAINER }}" `
          --name "latest.zip" `
          --file ".\deploy.zip" `
          --overwrite true
        $expiry = (Get-Date).AddYears(1).ToString("yyyy-MM-ddTHH:mm:ssZ")
        $sas = az storage blob generate-sas `
          --account-name "${{ env.STORAGE_ACCOUNT }}" `
          --account-key $key `
          --container-name "${{ env.DEPLOY_CONTAINER }}" `
          --name "latest.zip" `
          --permissions r `
          --expiry $expiry `
          --output tsv
        $blobUrl = "https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net/${{ env.DEPLOY_CONTAINER }}/latest.zip?$sas"
        # Use ARM REST API directly — az CLI splits on & in the SAS URL, truncating it
        $sub = az account show --query id -o tsv
        $token = az account get-access-token --resource https://management.azure.com --query accessToken -o tsv
        $baseUrl = "https://management.azure.com/subscriptions/$sub/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ env.AZURE_FUNCTIONAPP_NAME }}"
        $headers = @{ Authorization = "Bearer $token"; "Content-Type" = "application/json" }
        $current = Invoke-RestMethod -Uri "$baseUrl/config/appsettings/list?api-version=2023-12-01" -Method POST -Headers $headers
        $props = @{}
        $current.properties.PSObject.Properties | ForEach-Object { $props[$_.Name] = $_.Value }
        $props["WEBSITE_RUN_FROM_PACKAGE"] = $blobUrl
        $bodyFile = Join-Path $env:TEMP "deploy-appsettings.json"
        @{ properties = $props } | ConvertTo-Json -Depth 5 | Out-File $bodyFile -Encoding utf8
        Invoke-RestMethod -Uri "$baseUrl/config/appsettings?api-version=2023-12-01" -Method PUT -Headers $headers -Body (Get-Content $bodyFile -Raw) | Out-Null
        Remove-Item $bodyFile
    - name: Restart Function App
      run: |
        az functionapp restart `
          --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" `
          --resource-group "${{ env.RESOURCE_GROUP }}"
